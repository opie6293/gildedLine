<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gilded Line — Build a Legacy</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gilded Line">
<meta name="theme-color" content="#0a100d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a100d;--bg2:#0e1612;--panel:#111a15;--panel2:#16221b;--line:#24342a;--line2:#2f4437;--gold:#d4af5a;--gold2:#f0d58a;--green:#58c98a;--red:#e2715f;--text:#ebe6d8;--muted:#8d998f;--dim:#5f6b62;--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100%}
body{background:radial-gradient(1200px 600px at 70% -10%,#1a2a20 0%,transparent 60%),var(--bg)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;background:var(--bg2);border:1px solid var(--line2);color:var(--text);border-radius:6px;padding:7px 10px;font-size:13px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
.serif{font-family:var(--serif)}
.up{color:var(--green)}.down{color:var(--red)}.muted{color:var(--muted)}.gold{color:var(--gold)}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(10,16,13,.92);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:700;letter-spacing:.18em;color:var(--gold2);font-size:16px;white-space:nowrap}
.logo .mark{width:28px;height:28px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:12px;letter-spacing:0}
.btn{padding:8px 14px;border-radius:7px;font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.btn-gold{background:linear-gradient(180deg,#e6c46f,#c49a3f);color:#1b1407;box-shadow:0 2px 10px rgba(212,175,90,.25)}
.btn-gold:hover{filter:brightness(1.08)}
.btn-ghost{border:1px solid var(--line2);color:var(--text);background:var(--panel)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold2)}
.btn-red{border:1px solid #5a2b24;color:#f2a497;background:#22130f}
.btn-red:hover{border-color:var(--red)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.tape{flex:1;overflow:hidden;white-space:nowrap;font-size:11px;color:var(--muted);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tape span{margin-right:20px}.tape b{color:var(--text);font-weight:600;margin-right:4px}
.topstat{text-align:right;line-height:1.15}
.topstat small{display:block;font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.topstat b{font-family:var(--serif);font-size:15px;color:var(--gold2)}
.icon-btn{width:32px;height:32px;border-radius:7px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--gold2);border-color:var(--gold)}
/* layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 53px)}
.side{border-right:1px solid var(--line);padding:16px 14px;background:rgba(14,22,18,.6)}
.prof{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.prof .name{font-family:var(--serif);font-size:19px;font-weight:700}
.prof .sub{font-size:11px;color:var(--muted)}
.prof .house{font-size:10px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-top:2px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.minibox{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px}
.minibox small{font-size:9px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;display:block}
.minibox b{font-family:var(--serif);font-size:14px}
.bar{height:5px;background:#1d2a22;border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .3s}
.nav{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.nav button{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);transition:.15s}
.nav button:hover{border-color:var(--line2);background:var(--panel2)}
.nav button.on{border-color:var(--gold);background:linear-gradient(90deg,rgba(212,175,90,.12),transparent)}
.nav .ic{width:26px;height:26px;border:1px solid var(--line2);border-radius:6px;display:grid;place-items:center;font-size:13px;color:var(--gold)}
.nav .t{font-family:var(--serif);font-weight:700;letter-spacing:.1em;font-size:12.5px;text-transform:uppercase}
.nav .d{font-size:10px;color:var(--muted)}
.main{padding:22px 26px 60px;max-width:1300px}
h1{font-family:var(--serif);font-size:30px;letter-spacing:.04em;font-weight:700}
h1:after{content:"";display:block;width:34px;height:2px;background:var(--gold);margin:6px 0 8px}
.lead{color:var(--muted);font-size:12.5px;margin-bottom:18px}
.lead em{color:var(--green);font-style:normal}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h3{font-family:var(--serif);font-size:17px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .btn,.card h3 select{font-family:var(--sans)}
.card h3 small{font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:400}
.stat small{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stat b{display:block;font-family:var(--serif);font-size:26px;color:var(--gold2);margin-top:6px;font-weight:700}
.stat b.g{color:var(--green)}.stat b.r{color:var(--red)}.stat b.w{color:var(--text)}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border-bottom:none}
.seg{display:flex;gap:4px}
.seg button{font-size:10px;padding:3px 8px;border:1px solid var(--line2);border-radius:5px;color:var(--muted)}
.seg button.on{background:var(--green);color:#06140c;border-color:var(--green);font-weight:600}
canvas{width:100%;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tk{font-weight:700;letter-spacing:.06em}
.tk small{display:block;font-weight:400;letter-spacing:0;color:var(--muted);font-size:11px}
.qty{width:76px}
.acts{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--muted)}
.pill.g{border-color:#2c6b47;color:var(--green)}.pill.r{border-color:#6b2f26;color:var(--red)}.pill.y{border-color:#6b5726;color:var(--gold2)}
.rich{display:flex;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line)}
.rich.me{background:linear-gradient(90deg,rgba(88,201,138,.13),transparent);border-radius:8px}
.rk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:#2a3a30;color:var(--muted)}
.rk.r1{background:#d4af5a;color:#1b1407}.rk.r2{background:#a7aeb0;color:#111}.rk.r3{background:#b07a4a;color:#111}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;border:1px solid var(--line2);background:#1b2a21;color:var(--gold2)}
.ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.ev:last-child{border-bottom:none}
.ev .d{color:var(--dim);font-size:11px;min-width:62px}
.ev.good .x{color:#bfe8cf}.ev.bad .x{color:#f3b3a8}
.list-scroll{max-height:340px;overflow:auto}
.opt{border:1px solid var(--line);border-radius:10px;padding:13px;background:var(--bg2);display:flex;flex-direction:column;gap:6px}
.opt .n{font-family:var(--serif);font-size:17px;font-weight:700}
.opt .m{font-size:12px;color:var(--muted)}
.opt .f{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.lock{opacity:.5}
.meter{height:8px;border-radius:9px;background:#1d2a22;overflow:hidden}
.meter i{display:block;height:100%}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.goal .c{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px}
.goal.done .c{background:var(--gold);border-color:var(--gold);color:#1b1407}
.goal.done .t{color:var(--gold2)}
.result{font-family:var(--serif);font-size:22px;text-align:center;padding:14px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);margin-top:12px;min-height:56px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(3,6,4,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.ov.show{display:flex}
.modal{background:linear-gradient(180deg,#17241c,#0f1813);border:1px solid var(--line2);border-radius:14px;padding:24px 26px;max-width:540px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.5);max-height:90vh;overflow:auto}
.modal h2{font-family:var(--serif);font-size:26px;color:var(--gold2);margin-bottom:8px}
.modal p{color:#cfd3c8;line-height:1.55;margin-bottom:10px}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.bg-pick{display:grid;gap:8px;margin:10px 0}
.bg-pick label{display:flex;gap:10px;border:1px solid var(--line2);border-radius:9px;padding:10px 12px;cursor:pointer;align-items:flex-start}
.bg-pick label:has(input:checked){border-color:var(--gold);background:rgba(212,175,90,.08)}
.bg-pick input{margin-top:3px;accent-color:var(--gold)}
.field .bg-pick label{text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:#17241c;border:1px solid var(--line2);border-left:3px solid var(--gold);padding:10px 14px;border-radius:8px;font-size:13px;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .25s ease}
.toast.good{border-left-color:var(--green)}.toast.bad{border-left-color:var(--red)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
@media (max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{border-right:none;border-bottom:1px solid var(--line)}.nav{flex-direction:row;overflow-x:auto}.nav button{min-width:150px}.g2,.g3{grid-template-columns:1fr}.tape{display:none}.main{padding:16px}}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{padding:7px 14px;border:1px solid var(--line2);border-radius:20px;font-size:12px;color:var(--muted);background:var(--panel)}.tabs button:hover{color:var(--text)}.tabs button.on{border-color:var(--gold);color:var(--gold2);background:rgba(212,175,90,.1)}

html{-webkit-text-size-adjust:100%}
button,input,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mnav,.mbar{display:none}
.modal.wide{max-width:980px}
.hlink{cursor:pointer;font-weight:700;color:var(--text);border-bottom:1px dotted var(--dim)}.hlink:hover{color:var(--gold2)}
.hd-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.lbl{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin:4px 0 6px}
.sbar{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:6px}.sbar b{text-align:right}
.pedgrid{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:repeat(8,auto);gap:3px;font-size:11.5px}
.pc{border:1px solid var(--line);border-radius:5px;padding:4px 6px;display:flex;align-items:center;background:var(--bg2)}.pc.m{border-left:3px solid #4f7bb8}.pc.f{border-left:3px solid #b86a8f}.pc.dup{border-color:var(--red);color:#f3b3a8}
.ppt{font-size:12px}.ppt td,.ppt th{padding:6px}
.scenbar{border:1px solid var(--gold);background:rgba(212,175,90,.08);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}.scenbar.ok{border-color:var(--green);background:rgba(88,201,138,.08)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.coat{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle;border:1px solid rgba(255,255,255,.25)}
.hcell{display:inline-flex;align-items:center;gap:6px}.silk{flex-shrink:0;vertical-align:middle}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ach{border:1px solid var(--line);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;opacity:.55}.ach b{font-family:var(--serif);font-size:15px}.ach span{font-size:12px;color:var(--muted)}.ach em{font-style:normal;font-size:11px;color:var(--gold)}
.ach.got{opacity:1;border-color:var(--gold);background:rgba(212,175,90,.07)}
.tree{display:flex;flex-direction:column;align-items:stretch}.tline{width:2px;height:16px;background:var(--gold);margin-left:22px;opacity:.6}
.tg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg2)}.tg.live{border-color:var(--gold)}
.tg-h{display:flex;gap:10px;align-items:center}.tg-n{width:26px;height:26px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-size:11px;color:var(--gold);flex-shrink:0}
.tg-k{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-left:36px}.kchip{font-size:11.5px;border:1px solid var(--line2);border-radius:20px;padding:2px 9px;color:var(--muted)}.kchip.heir{border-color:var(--gold);color:var(--gold2)}
.racehead{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px;flex-wrap:wrap}.rclock{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:15px;color:var(--gold2);background:#0b130f;border:1px solid var(--line2);padding:3px 8px;border-radius:6px}
.track{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line)}
.call{margin:10px 0;padding:9px 12px;border-left:3px solid var(--gold);background:var(--bg2);border-radius:6px;font-family:var(--serif);font-size:18px;min-height:44px}
.rorder{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px;font-size:12.5px}
.ro{display:flex;align-items:center;gap:7px;padding:3px 0}.ro.me .rn{color:var(--gold2);font-weight:600}.rp{width:16px;color:var(--dim);text-align:right}.rn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rg{color:var(--muted);font-variant-numeric:tabular-nums}
.cloth{display:inline-grid;place-items:center;min-width:20px;height:18px;border-radius:3px;font-size:10.5px;font-weight:700;border:1px solid rgba(0,0,0,.4)}
.rtable tr.me td{background:rgba(212,175,90,.1)}.rsum{margin-top:12px;font-size:13.5px}.rsum p{margin-bottom:6px}
.ticker{position:fixed;left:240px;right:0;bottom:0;height:36px;z-index:35;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(10,16,13,.97);border-top:1px solid var(--line2);font-size:12.5px}
.tk-bell{position:relative;width:30px;height:26px;border:1px solid var(--line2);border-radius:6px;font-size:12px;filter:grayscale(1)}
.tk-n{position:absolute;top:-6px;right:-8px;background:var(--gold);color:#1b1407;border-radius:10px;font-size:10px;font-weight:700;padding:0 5px;filter:none}
.tk-msg{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:middle;flex-shrink:0}.dot.good{background:var(--green)}.dot.bad{background:var(--red)}
.feedpanel{display:none;position:fixed;right:12px;bottom:44px;width:400px;max-height:60vh;overflow:auto;z-index:45;background:#121c16;border:1px solid var(--line2);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.feedpanel.show{display:block}
.fp-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#121c16}
.fp-i{display:flex;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.4}.fp-i .dot{margin-top:5px}.fp-d{font-size:10.5px;color:var(--dim);margin-top:2px}
.toasts,.offers{display:none!important}
.offerdock{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:16px}
.main{padding-bottom:70px}
.toast.note{position:relative;padding-right:30px}.toast.note b{display:block;margin-bottom:2px}.toast.note div{color:#cfd3c8;font-size:12.5px;line-height:1.4}
.toast .nx{position:absolute;top:4px;right:6px;color:var(--muted);font-size:16px;width:22px;height:22px}
.offers{position:fixed;right:16px;top:64px;width:330px;display:flex;flex-direction:column;gap:8px;z-index:40;pointer-events:none}
.offer{pointer-events:auto;background:linear-gradient(180deg,#1a2a20,#121c16);border:1px solid var(--gold);border-radius:10px;padding:11px 13px;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:tin .25s ease}
.offer .ot{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}.offer .ot b{font-family:var(--serif);font-size:16px;color:var(--gold2)}.offer .ot span{font-size:11px}
.offer .ob{font-size:12.5px;color:#cfd3c8;line-height:1.4;margin-bottom:8px}
textarea{width:100%;min-height:120px;background:var(--bg2);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;resize:vertical}
select{max-width:170px}
@media (max-width:860px){
 body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
 .top{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;gap:8px}
 .top>.btn,.tape{display:none}
 .logo{font-size:0;gap:0;flex:1}.logo .mark{font-size:12px}
 .topstat b{font-size:14px}
 .mnav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;position:sticky;top:calc(50px + env(safe-area-inset-top));z-index:19;background:rgba(10,16,13,.95);border-bottom:1px solid var(--line);scrollbar-width:none;backdrop-filter:blur(6px)}
 .mnav::-webkit-scrollbar{display:none}
 .mnav button{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:8px 13px;border:1px solid var(--line2);border-radius:20px;font-size:13px;color:var(--muted);background:var(--panel)}
 .mnav button.on{border-color:var(--gold);color:var(--gold2);background:rgba(212,175,90,.12)}
 .mnav button span{color:var(--gold)}
 .app{display:block;min-height:0}
 .side{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px;border-right:none;border-bottom:1px solid var(--line)}
 .side .prof{grid-column:1/-1;margin-bottom:4px}

function bzExp(id){const t=btype(id),g=S.bz[id];if(!g)return 0;const lv=g.lv.reduce((a,x,i)=>a+x*Math.pow(i+1,1.1),0);const c=CEOS[(S.ceo||{})[id]||0];let m=t.base*lv*(S.econ.phase>0?1.08:.75)*Math.max(.8+S.skill/250,famF(id)||c.f)*(1+officeBonus())*lawBiz()*D().prof*(tr('shrewd')?1.12:1);if(S.pw&&S.pw[id])m*=.7;if(S.shocks&&S.shocks.oil&&(id==='air'||id==='freight'))m*=.6;m*=obsF(t)*warF(id)*satF(bzN(id),capB(t))*regAvg('prof')*(S.cartel?.85:1)*(mg('dyson')?1.5:1)*(t.space&&mg('station')?1.15:1);return m}

 const biz=Object.keys(S.bz).reduce((a,id)=>a+bzExp(id)*.92-ceoCost(id),0)+S.acq.reduce((a,x)=>a+acqProfit(x),0);

 const living=livingCost(), interest=S.credit*cRate()/12;

function updMarket(){
 const ed=S.econ.phase>0?.005:-.016;
 [...STOCKS,...CMDTY].forEach(t=>{const m=S.market[t.k];let r=t.mu+t.beta*ed+t.vol*gauss();if(S.shocks&&S.shocks.bubble&&GROW.includes(t.k))r+=.05;if(R()<.02)r+=(R()<.5?-1:1)*t.vol*3;const np=Math.max(.01,m.p*Math.exp(r));m.r=Math.log(np/m.p);m.p=np;m.h.push(m.p);if(m.h.length>120)m.h.shift()});
 ETFS.forEach(e=>{const m=S.market[e.k];const r=e.comp.reduce((a,k)=>a+S.market[k].r,0)/e.comp.length-e.fee/12;m.r=r;m.p*=Math.exp(r);m.h.push(m.p);if(m.h.length>120)m.h.shift()});
}
/* --- selling helpers (return proceeds) --- */
function cgTax(k,q){const p=S.market[k].p,gain=(p-(S.basis[k]||p))*q;let tx=0;if(gain>0){tx=gain*.2*taxM();S.cash-=tx;st('tax',tx)}st('gains',gain-tx);if(gain>(S.stats.bestV||0)){S.stats.bestV=gain;S.stats.bestK=k}return tx}
function applyMult(map){for(const k in map){const m=S.market[k];m.p=Math.max(.01,m.p*map[k]);m.r+=Math.log(map[k]);m.h[m.h.length-1]=m.p}ETFS.forEach(e=>{const lr=e.comp.reduce((a,k)=>a+Math.log(map[k]||1),0)/e.comp.length;if(!lr)return;const m=S.market[e.k];m.p*=Math.exp(lr);m.r+=lr;m.h[m.h.length-1]=m.p})}
function sellPriced(k){cgTax(k,S.stocks[k]||0);const v=(S.stocks[k]||0)*S.market[k].p;S.cash+=v;delete S.stocks[k];delete S.basis[k];return v}
function sellAllPriced(cat){let v=0;Object.keys(S.stocks).forEach(k=>{if(!cat||tdef(k).cat===cat)v+=sellPriced(k)});return v}
function sellBondLots(type){let v=0;S.bonds=S.bonds.filter(l=>{if(type&&l.type!==type)return true;v+=lotSale(l);return false});S.cash+=v;return v}
function withdrawFund(id){const f=S.funds[id];if(!f)return 0;const pen=S.t<f.lock?.1:0;const v=f.value*(1-pen);S.cash+=v;delete S.funds[id];return v}
function withdrawMgr(amt){const v=Math.min(amt??S.mgr.value,S.mgr.value);S.mgr.value-=v;S.cash+=v;return v}
function takeProps(id,k,f){const g=S.pr[id];const s=k/g.n,v=g.val*s,l=g.loan*s;g.val-=v;g.loan-=l;g.pmt-=g.pmt*s;g.n-=k;if(g.n<=0)delete S.pr[id];return v*f-l}
function sellProps(type){let v=0;Object.keys(S.pr).forEach(id=>{if(type&&id!==type)return;v+=takeProps(id,S.pr[id].n,.95)});S.cash+=v;return v}
function sellBiz(type){let v=0;Object.keys(S.bz).forEach(id=>{if(type&&id!==type)return;v+=bzVal(id);delete S.bz[id]});S.cash+=v;return v}

  let win=0,msg='';
  if(d.g==='red'||d.g==='black'){const n=rint(0,36);const reds=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];const col=n===0?'green':reds.includes(n)?'red':'black';win=col===d.g?b*2:0;msg=`Ball lands on ${n} ${col}.`}
  else if(d.g==='num'){const pk=clamp(Math.floor(+$('numPick').value||0),0,36),n=rint(0,36);win=n===pk?b*36:0;msg=`Ball lands on ${n}.`}
  else if(d.g==='dice'){const a=rint(1,6),c=rint(1,6);win=a+c>=8?b*2.3:0;msg=`Dice: ${a} + ${c} = ${a+c}.`}
  S.cash+=win-b;S.casino+=win-b;st('casino',win-b);S.hap=clamp(S.hap+(win?2:-1),0,100);
  UI.casinoMsg=`${msg} ${win?`<span class="up">You win ${money(win)}!</span>`:`<span class="down">You lose ${money(b)}.</span>`}`;

function pay(c){if(c>S.cash){toast(`Not enough cash (need ${money(c)})`,'bad');return false}S.cash-=c;return true}
let autoT=null;
function blocked(){return !S||S.dead||S.pendingHeir||$('ov').classList.contains('show')}
function setAuto(on){UI.auto=on;clearInterval(autoT);autoT=null;if(on)autoT=setInterval(()=>{if(blocked()){setAuto(false);render();return}UI.inTick=true;try{tick()}finally{UI.inTick=false}if(++UI.n%6===0||blocked())save();if(blocked()){setAuto(false);render()}else render(true)},1000/SPEEDS[UI.spd])}
function b64e(str){return btoa(unescape(encodeURIComponent(str)))}
function b64d(s){return decodeURIComponent(escape(atob(s)))}
async function exportCode(){const json=JSON.stringify({s:S,p:P},(k,v)=>typeof v==='number'&&!Number.isInteger(v)?+v.toPrecision(7):v);
 if(window.CompressionStream&&window.Response){try{const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());let bin='';for(let i=0;i<buf.length;i+=8192)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));return 'GLZ1:'+btoa(bin)}catch(e){}}
 return 'GL1:'+b64e(json)}
async function importCode(code){code=(code||'').replace(/\s+/g,'');let json;
 if(code.startsWith('GLZ1:')){const bin=atob(code.slice(5));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));json=await new Response(ds).text()}
 else if(code.startsWith('GL1:'))json=b64d(code.slice(4));else throw new Error('That is not a Gilded Line save code.');
 const o=JSON.parse(json);if(!o.s||!o.s.house)throw new Error('Save data is missing.');return o}
function showExport(){setAuto(false);modal('Export save',`<p>Copy this code and paste it into <b>Import</b> on your other device. It includes your Legacy Points and perks.</p><textarea id="expTxt" readonly>Generating…</textarea><div class="acts" style="justify-content:flex-start;margin-top:8px"><button class="btn btn-gold btn-sm" id="cpy">Copy code</button><span class="muted" id="expInfo" style="font-size:12px"></span></div>`,[{l:'Done',c:'ghost'}]);
 exportCode().then(c=>{const ta=$('expTxt');if(!ta)return;ta.value=c;$('expInfo').textContent=(c.length/1024).toFixed(0)+' KB'});
 $('cpy').onclick=()=>{const ta=$('expTxt');try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copied','good'),()=>{ta.select();toast('Select all and copy manually','bad')})}catch(e){ta.focus();ta.select();toast('Select all and copy manually','bad')}}}
function showImport(fromStart){setAuto(false);modal('Import save',`<p>Paste a save code from another device. This replaces the game in this browser.</p><textarea id="impTxt" placeholder="GLZ1:…"></textarea><div class="muted" id="impErr" style="font-size:12px;color:var(--red);margin-top:6px"></div><div class="acts" style="justify-content:flex-start;margin-top:8px"><button class="btn btn-gold btn-sm" id="impGo">Load this save</button></div>`,[{l:'Cancel',c:'ghost',f:()=>{if(fromStart||!S)startScreen(false)}}]);
 $('impGo').onclick=async()=>{try{const o=await importCode($('impTxt').value);S=o.s;migrate();if(o.p){const pk={...P.perks};for(const k in o.p.perks||{})pk[k]=Math.max(pk[k]||0,o.p.perks[k]);P={lp:Math.max(P.lp,o.p.lp||0),perks:pk,dyn:(o.p.dyn||[]).length>P.dyn.length?o.p.dyn:P.dyn};saveP()}
  save();$('ov').classList.remove('show');UI.view='overview';render();toast(`Loaded House ${S.house}`,'good')}catch(e){$('impErr').textContent=e.message||'Could not read that code.'}}}
function advance(n){if($('ov').classList.contains('show')||S.dead)return;for(let i=0;i<n;i++){tick();if(S.dead||S.pendingHeir||$('ov').classList.contains('show'))break}save();render()}

function pricedTable(list,title,note){if(!list.length)return `<div class="card"><h3>${title}</h3><p class="muted">Nothing of this kind trades yet in ${yearNow()}.</p></div>`;
 const held=list.filter(t=>S.stocks[t.k]).reduce((a,t)=>a+S.stocks[t.k]*S.market[t.k].p,0);
 return `<div class="card"><h3>${title}<span class="acts"><small>Holdings ${money(held)}</small>${held?`<button class="btn btn-red btn-sm" data-act="sellCat" data-c="${list[0].cat}">Sell all</button>`:''}</span></h3>${note?`<p class="muted" style="font-size:12px;margin:-4px 0 10px">${note}</p>`:''}<div style="overflow-x:auto"><table><tr><th>Asset</th><th class="num">Price</th><th class="num">1M</th><th>24 months</th><th class="num">Yield</th><th class="num">Held</th><th class="num">Value / P&L</th><th class="num">Trade</th></tr>
 ${list.map(t=>{const m=S.market[t.k],h=m.h,p=m.p,c=(p/(h[h.length-2]||p)-1)*100,hd=S.stocks[t.k]||0,pl=hd?(p-S.basis[t.k])*hd:0;
  return `<tr><td class="tk" data-act="chart" data-k="${t.k}" style="cursor:pointer">${t.k} <span class="muted" style="font-size:10px;font-weight:400">chart ›</span><small>${t.n}</small></td><td class="num">${money(p)}</td><td class="num ${c>=0?'up':'down'}">${c>=0?'+':''}${c.toFixed(1)}%</td><td>${spark(h)}</td><td class="num">${t.div?(t.div*100).toFixed(1)+'%':'—'}</td><td class="num">${cnt(hd)}</td><td class="num">${hd?money(hd*p)+`<div class="${pl>=0?'up':'down'}" style="font-size:11px">${signed(pl)}</div>`:'—'}</td>
  <td><div class="acts"><input class="qty" id="q_${t.k}" type="number" min="0" placeholder="qty"><button class="btn btn-gold btn-sm" data-act="buy" data-k="${t.k}">Buy</button><button class="btn btn-gold btn-sm" data-act="buy" data-k="${t.k}" data-max="1" ${dis(S.cash>=p)}>Buy max</button>${hd?`<button class="btn btn-ghost btn-sm" data-act="sell" data-k="${t.k}">Sell</button><button class="btn btn-red btn-sm" data-act="sell" data-k="${t.k}" data-all="1">Sell all</button>`:''}</div></td></tr>`}).join('')}</table></div></div>`}

 const me={name:h.name,ageM:h.ageM,cond:h.cond,sharp:h.sharp,surf:h.surf,temp:h.temp,g:h.g,al:h.al,eq:h.eq,spd:h.spd,sta:h.sta,acc:h.acc,grit:h.grit,silk:mySilk(),jockey:jk?pick(JOCKEYS.slice(0,4)):pick(JOCKEYS),mine:true,topJ:jk,u:h.u,strat:opts.strat||'auto'};
 const field=buildField(r,[me]),order=runRace(r,field),pos=me.pos,win1=order[0],split=[.6,.2,.1,.05,.03,.02],prize=pos<=6?r.purse*split[pos-1]:0;

 const beat=pos===1?`by ${lenTxt(order[1].T-me.T)}`:lenTxt(me.T-win1.T);
 h.pp.unshift({t:S.t,race:r.n,g:r.g,cls:r.cls,d:r.d,surf:r.surf,cond:r.cond,pos,n:order.length,fig:me.fig,odds:oddsTxt(me.odds),strat:me.strat,beat,time:fmtT(me.T),pace:r.pace,jk:me.jockey});h.pp=h.pp.slice(0,12);

 h.starts++;h.earn+=prize;h.yEarn=(h.yEarn||0)+prize;h.form.unshift(pos);h.form=h.form.slice(0,6);h.cond=Math.max(10,h.cond-32-(r.intl?15:0));h.sharp=Math.min(100,(h.sharp||50)+5);h.lastRace=S.t;if(r.intl)h.away=S.t+2;
 if(pos===1){h.wins++;if(h.bred){S.hy=S.hy||{};S.hy.bredWins=(S.hy.bredWins||0)+1}}else if(pos<=3)h.places++;
 if(pos===1&&r.g){h.gw++;h.fame+=(4-r.g)*6+(r.big?10:0)+(r.intl?8:0);S.trophies=S.trophies||[];S.trophies.unshift({race:r.n,horse:h.name,year:S.year0+Math.floor(S.t/12),purse:r.purse,g:r.g,where:r.intl?r.track:''});
  if(r.g===1){h.g1++;st('g1',1);S.rep=Math.min(100,S.rep+3);S.opinion=Math.min(100,S.opinion+3);if(h.bred)S.stats.bredG1=1;if(r.world)S.stats.worldWin=1;if(r.intl)st('intlG1',1)}}
 if(pos===1)h.fame+=1;
 if(r.a3&&r.crown!=null){h.crown=h.crown||{};if(pos===1)h.crown[r.crown]=true;if(h.crown[0]&&h.crown[1]&&h.crown[2]&&!S.stats.triple){S.stats.triple=1;S.rep=Math.min(100,S.rep+10);S.opinion=Math.min(100,S.opinion+10);log(`${h.name} wins the Triple Crown!`,'good');notify('TRIPLE CROWN',`${h.name} sweeps the Derby, Halloway Cup and Kingsbridge Stakes.`,'good',true)}}
 // rival bookkeeping
 S.h2h=S.h2h||{};order.forEach((f,i)=>{if(f.mine)return;const k=f.si;if(k==null)return;const H=S.h2h[k]||(S.h2h[k]={me:0,them:0});if(f.pos<pos)H.them++;else H.me++;
  if(f.ref){const R0=f.ref,pz=f.pos<=6?r.purse*split[f.pos-1]:0;R0.starts++;R0.earn+=pz;R0.yEarn=(R0.yEarn||0)+pz;R0.lastRace=S.t;R0.cond=Math.max(20,R0.cond-30);if(f.pos===1){R0.wins++;if(r.g===1)R0.g1++}
   R0.pp.unshift({t:S.t,race:r.n,g:r.g,d:r.d,surf:r.surf,cond:r.cond,pos:f.pos,n:order.length,fig:f.fig});R0.pp=R0.pp.slice(0,6)}});

 if(opts.quiet){if(pos===1&&r.g)notify(`${h.name} wins!`,`${r.n} · ${money(prize)}`,'good',r.g<=2)}else{checkAch();save();render();showRace(r,order,me,res)}return pos}

/* ---------- injuries & vet ---------- */
function injuryDecision(h,mo,career){if(S.rmgr&&S.rmgr.on&&S.rmgr.vet){if(career){const c=surgeryCost(h);if(horseVal(h)>c*4&&S.cash>c*3){S.cash-=c;surgery(h)}}return}
 if(!addOffer('inj',{hu:h.u,name:h.name,mo,career,cost:career?surgeryCost(h):0})){/* another decision pending: keep the default */}}
const surgeryCost=h=>Math.max(50000,Math.round(horseVal(h)*.08));
function surgery(h){if(R()<.6){h.injEnd=false;h.inj+=4;log(`Surgery on ${h.name} succeeded — the career is saved.`,'good');notify('Surgery succeeded',`${h.name} will race again after a longer layoff.`,'good')}else{log(`Surgery on ${h.name} could not save the career.`,'bad');notify('Surgery failed',`${h.name} will be retired.`,'bad')}}
OFFERS.inj={t:'Injury report',x:o=>o.career?`${o.name} has a serious injury. Surgery (${money(o.cost)}) has a 60% chance of saving the career; otherwise the horse retires.`:`${o.name} is out ${o.mo} months. Rushing back halves the layoff but triples injury risk for 6 months.`,
 o:o=>o.career?['Retire','Surgery '+money(o.cost)]:['Full rest','Rush back'],
 run:(o,i)=>{const h=S.horses.find(x=>x.u==o.hu);if(!h||!i)return;if(o.career){if(S.cash<o.cost)return toast('Not enough cash','bad');S.cash-=o.cost;surgery(h)}else{h.inj=Math.max(1,Math.ceil(h.inj/2));h.rushTil=S.t+h.inj+6;log(`${h.name} is being rushed back.`,'info')}}};
OFFERS.buyer={t:'Offer for your horse',x:o=>`${RSTAB[o.si].n} offers ${money(o.amt)} for ${o.name}${(()=>{const h=S.horses.find(x=>x.u==o.hu);return h?` (valued at ${money(horseVal(h))})`:''})()}.`,o:o=>['Decline','Sell for '+money(o.amt)],
 run:(o,i)=>{if(!i)return;const h=S.horses.find(x=>x.u==o.hu);if(!h)return;S.cash+=o.amt;S.horses=S.horses.filter(x=>x!==h);log(`Sold ${h.name} to ${RSTAB[o.si].n} for ${money(o.amt)}.`,'good')}};
function retireHorse(h,to){h.status=to;h.plan='rest';if(to!=='race'&&(h.g1>=3||h.earn>=1e7)&&!h.hof){h.hof=true;S.hof=S.hof||[];S.hof.unshift({name:h.name,earn:h.earn,g1:h.g1,wins:h.wins,starts:h.starts,year:S.year0+Math.floor(S.t/12)});log(`${h.name} is inducted into the Hall of Fame.`,'good');notify('Hall of Fame',`${h.name} — ${h.wins} wins, ${h.g1} Grade 1s, ${money(h.earn)}`,'good',true)}
 if(to!=='race')log(`${h.name}: ${to==='stud'?'retired to stud':to==='broodmare'?'retired to the broodmare band':'retired'}.`,'info')}

/* ---------- breeding ---------- */
function sireOptions(m){const L=[];S.horses.filter(s=>s.status==='stud').forEach(s=>L.push({kind:'own',ref:s,name:s.name,fee:0,rate:hRate(s)}));(S.studs||[]).forEach((s,i)=>L.push({kind:'ext',i,ref:s,name:s.name,fee:s.fee,rate:hRate(s)}));
 L.forEach(o=>{o.inb=inbredCount(o.ref,m);o.nick=isNick(o.ref,m);o.score=(STATK.reduce((a,k)=>a+o.ref.g[k],0)/4)+(o.nick?4:0)-o.inb*6});return L}
function coverMare(m,o){if(o.fee&&!pay(o.fee))return false;const s=o.ref;m.preg={due:S.t+11,sire:s.name,sg:{...s.g},sal:s.al||mkAl(),sped:pedOf(s),nick:o.nick,inb:o.inb};log(`${m.name} is in foal to ${s.name}${o.nick?' (a known nick)':''}.`,'good');return true}
function foal(m){const p=m.preg,g={},sd=7+(p.inb?4:0)+(p.inb>1?3:0),bonus=(p.nick?2:0)-(p.inb?2:0);
 STATK.forEach(k=>g[k]=clamp(Math.round((m.g[k]+p.sg[k])/2+gauss()*sd+1+bonus),25,100));g.temp=clamp(Math.round((m.g.temp+p.sg.temp)/2+gauss()*12),10,100);g.surf=R()<.5?m.g.surf:p.sg.surf;
 g.wet=clamp(Math.round(((m.g.wet??50)+(p.sg.wet??50))/2+gauss()*12),5,95);g.frag=clamp(Math.round(((m.g.frag??40)+(p.sg.frag??40))/2+gauss()*12+(p.inb?12:0)),5,95);
 const al={};GK.forEach(k=>al[k]=[pick(p.sal[k]||[false,false]),pick((m.al&&m.al[k])||[false,false])]);
 return mkHorse({g,al,ageM:0,sire:p.sire,dam:m.name,bred:true,ped:{s:trimPed(p.sped,2),d:trimPed(pedOf(m),2)}})}
function genStuds(){S.studs=Array.from({length:6},()=>{const q=clamp(70+gauss()*9,55,98),g=mkGenes(q,4),n=randN(),h={name:n,g,al:mkAl(),ped:{s:mkPed(randN(),1),d:mkPed(randN(),1)},spd:g.spd,sta:g.sta,acc:g.acc,grit:g.grit,ageM:96,fame:rint(5,60),g1:R()<.4?rint(1,4):0};h.fee=Math.round(studFee(h));return h}).sort((a,b)=>b.fee-a.fee);S.studsT=S.t}

/* ---------- auctions (with consignments) ---------- */
function genLots(){S.horses.filter(h=>h.consign).forEach(h=>{const v=Math.round(horseVal(h)*(.7+R()*.8));S.cash+=v;S.horses=S.horses.filter(x=>x!==h);log(`${h.name} sold at auction for ${money(v)}.`,'good');notify('Sold at auction',`${h.name} — ${money(v)}`,'good')});
 const sc=perk('scout'),L=[];for(let i=0;i<6;i++){const yearling=R()<.7;const q=clamp(62+gauss()*10+sc*3,35,98);const h=mkHorse({q,ageM:yearling?rint(12,20):rint(26,54)});
  if(!yearling){h.starts=rint(2,14);h.wins=Math.max(0,Math.round(h.starts*clamp((hRate(h)-55)/70,0,.5)+gauss()));h.earn=h.wins*rint(20,90)*1000*(1+Math.max(0,hRate(h)-70)/8);h.form=Array.from({length:Math.min(5,h.starts)},()=>rint(1,9))}
  h.pedQ=Math.max(1,Math.min(5,Math.round((clamp(q+gauss()*6,30,100)-40)/12)));h.price=Math.round(horseVal(h)*(.75+R()*.6));h.lot=rint(100,999);h.est={};STATK.forEach(k=>h.est[k]=clamp(Math.round(h.g[k]+gauss()*(10-sc*2.8)),20,100));L.push(h)}
 S.lots=L.sort((a,b)=>a.lot-b.lot);S.lotsT=S.t;if(S.rmgr&&S.rmgr.on&&S.rmgr.buy)mgrBuy()}
function mgrBuy(){let budget=S.rmgr.budget;S.lots.slice().sort((a,b)=>STATK.reduce((x,k)=>x+b.est[k],0)/Math.log(b.price)-STATK.reduce((x,k)=>x+a.est[k],0)/Math.log(a.price)).forEach(l=>{if(S.horses.length>=capH()||l.price>budget||S.cash<l.price*2)return;S.cash-=l.price;budget-=l.price;S.lots=S.lots.filter(x=>x!==l);delete l.price;delete l.est;delete l.lot;S.horses.push(l);log(`Racing manager bought ${l.name} at auction.`,'info')})}

/* ---------- racing manager ---------- */
function mgrAct(){const M=S.rmgr;ensureCard();
 S.horses.forEach(h=>{hMig(h);if(M.train){if(h.inj)h.plan='pool';else if(h.status!=='race')h.plan='rest';else if(h.ageM<24)h.plan='balanced';else if(h.cond<60)h.plan='rest';else if(h.sharp<55)h.plan='balanced';
   else{let best='balanced',gap=4;STATK.forEach(k=>{const d=h.g[k]-h[k];if(d>gap){gap=d;best={spd:'speed',sta:'stamina',acc:'gate',grit:'heart'}[k]}});h.plan=best}
   h.eq={blink:h.temp<45,tt:dOpt(h)>=9.5,mud:h.g.wet>=60||expr(h,'mud')}}
  if(M.vet&&h.ageM>=20&&!h.scanned&&S.cash>5e4){S.cash-=5000;h.scanned=true}});
 if(M.retire)S.horses.slice().forEach(h=>{if(h.status!=='race'||h.inj)return;const r=hRate(h),y=hAge(h),sire=h.sex==='m'&&!h.gelding;
  if(y>=5&&(h.g1>0||r>=72))retireHorse(h,sire?'stud':'broodmare');else if(!sire&&y>=4&&r>=66&&h.wins>=3)retireHorse(h,'broodmare');else if(y>=8)retireHorse(h,sire&&r>=64?'stud':h.sex==='f'&&r>=60?'broodmare':'retired')});
 if(M.breed&&S.t%12<=5)S.horses.filter(m=>m.status==='broodmare'&&!m.preg&&m.ageM<240).forEach(m=>{const o=sireOptions(m).filter(o=>o.fee<=Math.max(5e4,S.cash*.02)).sort((a,b)=>b.score-a.score)[0];if(o)coverMare(m,o)});
 if(M.sell){S.horses.filter(h=>h.status==='retired'||(h.status==='race'&&hAge(h)>=5&&hRate(h)<52)).forEach(h=>h.consign=true)}
 if(M.race){S.horses.filter(h=>h.status==='race').sort((a,b)=>hRate(b)-hRate(a)).forEach(h=>{if(h.cond<M.minFit||h.lastRace===S.t||!S.horses.includes(h))return;let best=null,bs=0;
  S.card.races.forEach(r=>{if(eligible(h,r))return;const e=pfExp(h,r,r.purse>=2e5)-r.L;if(e<-1.5)return;if(r.claim&&horseVal(h)>r.claimP*1.3)return;if(r.intl&&(e<2||r.purse<r.ship*15))return;const sc=r.purse/(1+Math.exp(-(e-1)/2.2));if(sc>bs){bs=sc;best=r}});
  if(best&&S.cash>best.purse*.05)enterRace(best.id,h.u,best.purse>=2e5,0,{quiet:true,strat:'auto'})})}}

/* ---------- awards ---------- */
function yearAwards(){const yr=S.year0+Math.floor(S.t/12),mine=S.horses.filter(h=>h.yEarn>0),all=mine.map(h=>({h,me:1})).concat((S.rpool||[]).filter(h=>h.yEarn>0).map(h=>({h,me:0})));
 const rec={yr};if(all.length){const b=all.sort((a,b)=>b.h.yEarn-a.h.yEarn)[0];rec.hoty=b.h.name;rec.hotyMe=!!b.me;rec.hotyStable=b.me?'House '+S.house:RSTAB[b.h.si].n;if(b.me){b.h.fame+=25;S.rep=Math.min(100,S.rep+3);S.opinion=Math.min(100,S.opinion+2);notify('Horse of the Year',`${b.h.name} is ${yr}'s Horse of the Year.`,'good',true)}}
 const myT=mine.reduce((a,h)=>a+h.yEarn,0),stab=RSTAB.map((s,i)=>(S.rpool||[]).filter(h=>h.si===i).reduce((a,h)=>a+(h.yEarn||0),0)),ti=stab.indexOf(Math.max(...stab));
 rec.owner=myT>stab[ti]&&myT>0?'House '+S.house:RSTAB[ti].n;rec.ownerMe=myT>stab[ti]&&myT>0;if(rec.ownerMe){S.rep=Math.min(100,S.rep+4);notify('Champion Owner',`House ${S.house} topped the ${yr} owners' table with ${money(myT)}.`,'good',true)}
 rec.breederMe=((S.hy&&S.hy.bredWins)||0)>=4;if(rec.breederMe){S.rep=Math.min(100,S.rep+2);notify('Breeder of the Year',`${S.hy.bredWins} wins by homebred horses in ${yr}.`,'good',true)}
 if(mine.length||rec.hoty){S.awards=S.awards||[];S.awards.unshift(rec);S.awards=S.awards.slice(0,40)}
 S.horses.forEach(h=>h.yEarn=0);(S.rpool||[]).forEach(h=>h.yEarn=0);S.hy={bredWins:0}}

/* ---------- monthly ---------- */
function horseMonthly(br){if(!S.stable)return;ensurePool();const T=TRAINERS[S.stable.trainer];if(S.stable.lvl>0)br.other-=T.cost;const M=S.rmgr;if(M&&M.on&&S.stable.lvl>0){br.other-=RMGR_COST;mgrAct()}
 const mo=S.t%12;let born=[];
 S.horses=S.horses.filter(h=>{hMig(h);h.ageM++;br.other-=h.status==='retired'?1500:4000;const pl=PLANS[h.plan]||PLANS.balanced;
  if(h.inj>0){h.inj=Math.max(0,h.inj-(h.plan==='pool'?2:1));h.cond=Math.min(100,h.cond+6);if(!h.inj&&h.injEnd){h.injEnd=false;retireHorse(h,h.sex==='m'&&!h.gelding?'stud':'broodmare')}}
  else h.cond=Math.min(100,h.cond+(h.status==='race'?(pl.cond??14):20));
  if(h.status==='race'&&h.ageM>=12&&!h.inj){const base=h.ageM<24?T.rate*.6:T.rate;STATK.forEach(k=>{const m=pl.k?(pl.k===k?1.7:.6):(pl.g??1);h[k]=Math.min(h.g[k],h[k]+(h.g[k]-h[k])*base*m+(h.ageM<24?.12*(pl.g??1):0))});
   h.sharp=clamp((h.sharp??50)+(pl.sh??8)-3,0,100);if(!['rest','pool'].includes(h.plan)&&h.cond<45&&R()<.03*(.5+h.g.frag/80)){h.inj=rint(1,3);log(`${h.name} pulled up sore in training — out ${h.inj} months.`,'bad')}}
  else h.sharp=Math.max(0,(h.sharp??50)-10);
  if(h.status==='race'&&h.ageM>=120)retireHorse(h,h.sex==='m'&&!h.gelding?'stud':'broodmare');
  if(h.status==='stud'&&mo<=5){const fee=studFee(h),n=rint(1,3+Math.floor(h.fame/15));br.other+=fee*n*.5}
  if(h.preg&&S.t>=h.preg.due){const f=foal(h);born.push(f);log(`A ${COATS[f.coat][0].toLowerCase()} ${f.sex==='m'?'colt':'filly'} is foaled: ${f.name} (by ${h.preg.sire} out of ${h.name}).`,'good');notify('New foal',`${f.name}, by ${h.preg.sire} out of ${h.name}${h.preg.nick?' · a nick':''}`,'good');h.preg=null}
  if(h.ageM>=300&&R()<.02){log(`${h.name} has died, aged ${hAge(h)}.`,'info');return false}return true});
 born.forEach(f=>{if(S.horses.length<capH())S.horses.push(f);else{const v=horseVal(f)*.8;S.cash+=v;log(`No room in the stable — ${f.name} sold as a foal for ${money(v)}.`,'info')}});
 if(S.stable.lvl>0&&R()<.12){const top=S.horses.filter(h=>h.status==='race'&&hRate(h)>=66&&!h.inj&&h.ageM>=24);if(top.length){const h=pick(top),si=rint(0,RSTAB.length-1),amt=Math.round(horseVal(h)*(1.25+R()*.55));
  if(M&&M.on&&M.sell){if(amt>=horseVal(h)*1.4){S.cash+=amt;S.horses=S.horses.filter(x=>x!==h);log(`Racing manager sold ${h.name} to ${RSTAB[si].n} for ${money(amt)}.`,'info')}}else addOffer('buyer',{hu:h.u,name:h.name,si,amt})}}
 poolMonthly();if(mo===11)yearAwards();
 if(!S.lots||S.t-S.lotsT>=3)genLots();if(!S.studs||S.t-S.studsT>=12)genStuds()}

/* ---------- init / migrate wrappers ---------- */

/* ---------- horse detail ---------- */
function pedGrid(h){const p=h.ped||{},names=pedNames(pedOf(h),[]).slice(1),dup=new Set(names.filter((n,i)=>names.indexOf(n)!==i)),cells=[];
 const add=(n,col,r0,sp,f)=>cells.push(`<div class="pc ${f?'f':'m'} ${n&&dup.has(n.n)?'dup':''}" style="grid-column:${col};grid-row:${r0}/span ${sp}">${n?n.n:'—'}</div>`);
 add(p.s,1,1,4,0);add(p.d,1,5,4,1);const g=[p.s&&p.s.s,p.s&&p.s.d,p.d&&p.d.s,p.d&&p.d.d];g.forEach((n,i)=>add(n,2,1+i*2,2,i%2));const gg=[];g.forEach(n=>gg.push(n&&n.s,n&&n.d));gg.forEach((n,i)=>add(n,3,1+i,1,i%2));
 return `<div class="pedgrid">${cells.join('')}</div>${dup.size?`<div class="muted" style="font-size:11.5px;margin-top:6px"><span class="down">Inbred</span> to ${[...dup].join(', ')} — more variable foals, higher fragility.</div>`:''}`}

   <td>${h.ageM<24?`S ${grade(h.est.spd)} · St ${grade(h.est.sta)} · A ${grade(h.est.acc)} · H ${grade(h.est.grit)}`:`Rating <b>${hRate(h)}</b> · ${dOpt(h).toFixed(1)}f ${h.surf}`}${sm(h.temp<35?'Hot-headed':h.temp>75?'Calm, professional':'Average temperament')}</td>
   <td class="num">${h.starts?`${h.starts}: ${h.wins} wins`:'Unraced'}</td><td class="num"><b class="gold">${money(h.price)}</b></td><td><button class="btn btn-gold btn-sm" data-act="buyHorse" data-u="${h.u}" ${dis(S.cash>=h.price&&S.horses.length<capH())}>Buy</button></td></tr>`).join('')}</table></div></div>`;
 if(tab==='breed'){const mares=S.horses.filter(h=>h.status==='broodmare');
  body=`<div class="grid g2"><div class="card"><h3>Broodmares<small>Foals arrive 11 months after covering</small></h3>
  <p class="muted" style="font-size:12px;margin:-4px 0 10px">A <b class="gold">nick</b> is a sire line that crosses well with the mare's sire (+2 to the foal). Shared ancestors mean <span class="down">inbreeding</span> — wilder foals and more fragility.</p>
  ${mares.map(m=>{const opts=sireOptions(m);return `<div class="row" style="flex-wrap:wrap"><span><span class="coat" style="background:${COATS[m.coat][1]}"></span><a class="hlink" data-act="horse" data-u="${m.u}">${m.name}</a>${sm(`${hAge(m)} · rating ${hRate(m)} · ${m.g1?m.g1+'× G1 winner':m.wins+' wins'} · by ${m.sire}`)}</span>
   ${m.preg?`<span class="pill y">In foal to ${m.preg.sire}${m.preg.nick?' · nick':''} · due ${MONTHS[m.preg.due%12]}</span>`:`<span class="acts"><select id="br_${m.u}">${opts.map(o=>`<option value="${o.kind}:${o.kind==='own'?o.ref.u:o.i}">${o.name}${o.kind==='own'?' (yours)':''} · ${o.rate} · ${o.fee?money(o.fee):'free'}${o.nick?' · ★ nick':''}${o.inb?' · ⚠ inbred':''}</option>`).join('')}</select><button class="btn btn-gold btn-sm" data-act="breed" data-u="${m.u}">Cover</button></span>`}</div>`}).join('')||'<div class="muted">Retire a filly or mare (3yo+) from racing to start breeding.</div>'}</div>
  <div class="card"><h3>Stallions</h3>${S.horses.filter(h=>h.status==='stud').map(s=>`<div class="row"><span><a class="hlink" data-act="horse" data-u="${s.u}">${s.name}</a> <span class="pill g">Yours</span>${sm(`rating ${hRate(s)} · fee ${money(studFee(s))} · sire line ${s.ped&&s.ped.s?s.ped.s.n:'—'}`)}</span></div>`).join('')}
  ${(S.studs||[]).map(s=>`<div class="row"><span><b>${s.name}</b>${sm(`rating ${hRate(s)} · ${s.g1?s.g1+'× G1 winner · ':''}best ${dOpt(s).toFixed(1)}f · sire line ${s.ped&&s.ped.s?s.ped.s.n:'—'}`)}</span><b class="gold">${money(s.fee)}</b></div>`).join('')}</div></div>`}
 if(tab==='rivals'){ensurePool();body=`<div class="card"><h3>Rival stables<small>Season earnings reset each January</small></h3><div style="overflow-x:auto"><table><tr><th>Stable</th><th>Trainer</th><th>Top horse</th><th class="num">Horses</th><th class="num">Season</th><th class="num">Career wins</th><th class="num">Head to head</th></tr>
  ${RSTAB.map((s,i)=>{const hs=S.rpool.filter(h=>h.si===i),top=hs.slice().sort((a,b)=>hRate(b)-hRate(a))[0],H=(S.h2h||{})[i]||{me:0,them:0};return `<tr><td><span class="hcell">${silkSVG(s.silk,24)} <b>${s.n}</b></span></td><td class="muted">${s.tr}</td><td>${top?`${top.name}${sm(`rating ${hRate(top)} · ${top.wins} wins${top.g1?' · '+top.g1+'× G1':''}`)}`:'—'}</td><td class="num">${hs.length}</td><td class="num">${money(hs.reduce((a,h)=>a+(h.yEarn||0),0))}</td><td class="num">${hs.reduce((a,h)=>a+h.wins,0)}</td><td class="num"><b class="${H.me>=H.them?'up':'down'}">${H.me}–${H.them}</b></td></tr>`}).join('')}</table></div>
  <p class="muted" style="font-size:12px;margin-top:10px">These stables' horses turn up in your races again and again. Head to head counts every race where one of their runners finished ahead of or behind yours.</p></div>
  <div class="card" style="margin-top:14px"><h3>Leading rival horses</h3>${S.rpool.slice().sort((a,b)=>hRate(b)-hRate(a)).slice(0,10).map(h=>`<div class="row"><span><span class="hcell">${silkSVG(RSTAB[h.si].silk,20)} <b>${h.name}</b></span>${sm(`${RSTAB[h.si].n} · ${hAge(h)}yo · ${h.starts}: ${h.wins} wins · ${money(h.earn)}${h.pp[0]?' · last: '+ordinal(h.pp[0].pos)+' in '+h.pp[0].race:''}`)}</span><b>${hRate(h)}</b></div>`).join('')}</div>`}
 if(tab==='honours')body=`<div class="grid g2"><div class="card"><h3>Trophy cabinet<small>${(S.trophies||[]).length} graded wins</small></h3>${(S.trophies||[]).slice(0,40).map(t=>`<div class="row"><span><b>${t.race}</b>${sm(`${t.horse} · ${t.year} · Grade ${t.g}${t.where?' · '+t.where:''}`)}</span><b class="gold">${money(t.purse)}</b></div>`).join('')||'<div class="muted">Win a graded stakes race to fill the cabinet.</div>'}${S.stats.triple?'<p class="gold" style="margin-top:10px">★ Triple Crown winner</p>':''}</div>
  <div><div class="card"><h3>Annual awards</h3>${(S.awards||[]).map(a=>`<div class="row"><span><b>${a.yr}</b>${sm(`Horse of the Year: ${a.hoty?`<span class="${a.hotyMe?'gold':''}">${a.hoty}</span> (${a.hotyStable})`:'—'} · Champion owner: <span class="${a.ownerMe?'gold':''}">${a.owner}</span>${a.breederMe?' · <span class="gold">Breeder of the Year</span>':''}`)}</span></div>`).join('')||'<div class="muted">Awards are handed out every December.</div>'}</div>
  <div class="card" style="margin-top:14px"><h3>Hall of Fame</h3>${(S.hof||[]).map(h=>`<div class="row"><span><b>${h.name}</b>${sm(`inducted ${h.year} · ${h.starts}: ${h.wins} wins · ${h.g1} Grade 1s`)}</span><b class="gold">${money(h.earn)}</b></div>`).join('')||'<div class="muted">Retire a horse with 3+ Grade 1 wins or $10M in earnings.</div>'}</div></div></div>`;
 return hdr+`<div class="tabs">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="htab" data-t="${k}">${l}</button>`).join('')}</div>`+body};
/* =====================================================================
   TIMELINE — start in 1850 and live through every era
   Internally every amount is in today's (2026) dollars; the screen shows
   period dollars using an approximate historical consumer price index.

const CPI=[[1800,12.6],[1815,13.5],[1830,9.2],[1850,8.3],[1860,8.6],[1865,15.0],[1880,9.9],[1900,8.4],[1913,9.9],[1920,20.0],[1929,17.1],[1933,13.0],[1940,14.0],[1945,18.0],[1950,24.1],[1960,29.6],[1970,38.8],[1980,82.4],[1990,130.7],[2000,172.2],[2010,218.1],[2020,258.8],[2026,330]];
function cpiAt(y){if(y>=2026)return 330*Math.pow(1.025,y-2026);if(y<=CPI[0][0])return CPI[0][1];for(let i=1;i<CPI.length;i++){const[a,va]=CPI[i-1],[b,vb]=CPI[i];if(y<=b)return va*Math.pow(vb/va,(y-a)/(b-a))}return 330}
const piAt=y=>cpiAt(y)/330;
UI.realMoney=(()=>{try{return localStorage.getItem('gl_real')==='1'}catch(e){return false}})();
function PIx(){if(!S||UI.realMoney||!S.year0)return 1;return piAt(S.year0+S.t/12)}
const yearNow=()=>S.year0+Math.floor(S.t/12);
const ERAS=[[1800,'Industrial Revolution'],[1865,'Gilded Age'],[1900,'Progressive Era'],[1914,'The Great War'],[1919,'Roaring Twenties'],[1930,'Great Depression'],[1939,'Second World War'],[1946,'Post-war Boom'],[1965,'Space Race'],[1975,'Stagflation & PCs'],[1990,'Information Age'],[2008,'Smartphone Era'],[2026,'Modern Era'],[2060,'Space Age']];
const eraName=()=>{const y=yearNow();let n=ERAS[0][1];ERAS.forEach(([a,b])=>{if(y>=a)n=b});return n};

/* ---------- when things exist ---------- */

 // stocks & instruments (IPO years)

 GLX:1976,DIV:1996,DEF:1998,GRW:1998,CMB:2005,GOLD:1800,SILV:1800,OIL:1870,AEC:2010,
 // bonds & funds
 tbill:1930,t10:1850,muni:1850,corp:1850,junk:1980,reit:1965,macro:1950,venture:1946,quant:1990,pe:1980,
 // businesses
 truck:1955,cafe:1850,salon:1900,agency:1920,gym:1960,resto:1850,freight:1850,brew:1850,soft:1975,pharma:1900,media:1950,bank:1850,air:1930,
 space:2002,stall:1800,smith:1800,mill:1800,rail:1830,shipco:1840,mine:1800,steel:1870,oilco:1870,auto:1905,radio:1922,cinema:1915,
 // property

 // regions, megaprojects, leagues

 {id:'shipco',n:'Steamship Line',cost:1.2e7,base:260000,v:.6},{id:'oilco',n:'Oil Company',cost:2e7,base:450000,v:.8},{id:'rail',n:'Railroad',cost:3e7,base:620000,v:.5},{id:'steel',n:'Steel Works',cost:5e7,base:1.05e6,v:.55},
 {id:'radio',n:'Radio Network',cost:8e6,base:170000,v:.6},{id:'cinema',n:'Movie Studio',cost:1.5e7,base:320000,v:.85},{id:'auto',n:'Automaker',cost:8e7,base:1.65e6,v:.65});

 const jn=y<1920?['Unemployed','Shop Clerk','Bookkeeper','Counting-house Clerk','Office Manager','Director','Partner','Senior Partner']:y<1960?['Unemployed','Shop Clerk','Bookkeeper','Junior Executive','Manager','Director','Partner','Managing Partner']:JOB_BASE;

 CARS.forEach((c,i)=>{c.n=cn[i][0];c.d=cn[i][1]});STRATS[2].d=avail(tdef('AEC'))?'Growth, crypto, a little ballast':'Growth stocks, a little ballast'}

 {y:1907,m:9,n:'Panic of 1907',k:'crash',s:.35,bank:1},{y:1914,m:7,n:'The Great War',k:'war',len:52},{y:1918,m:9,n:'Influenza pandemic',k:'flu'},{y:1929,m:9,n:'The Great Crash',k:'crash',s:.55,rec:46,bank:1},
 {y:1939,m:8,n:'Second World War',k:'war',len:72},{y:1973,m:9,n:'Oil crisis',k:'oil'},{y:1987,m:9,n:'Black Monday',k:'crash',s:.25,rec:10},{y:1997,m:0,n:'Dot-com mania',k:'bubble'},
 {y:2008,m:8,n:'Global financial crisis',k:'crash',s:.4,rec:20,bank:1},{y:2020,m:2,n:'Pandemic shock',k:'crash',s:.3,rec:6}];
function histTick(){const y=yearNow(),mo=S.t%12;S.histDone=S.histDone||{};
 HIST.forEach(e=>{if(S.histDone[e.n]||y!==e.y||mo<e.m)return;if(S.year0>e.y)return;S.histDone[e.n]=1;
  if(e.k==='crash'){const m={};STOCKS.forEach(t=>m[t.k]=t.beta>0?1-e.s*(.8+R()*.4):1.05);m.GOLD=1.1;applyMult(m);S.propIdx*=1-e.s*.3;for(const id in S.pr)S.pr[id].val*=1-e.s*.3;for(const id in S.bz)S.bz[id].vi*=1-e.s*.35;
   S.econ.phase=-1;S.econ.left=Math.round((e.rec||18)*D().rec);if(e.bank){S.shocks.bankrun=6;applyMult({MRD:.5})}st('crashes',1);headline(e.n,e.y===1929?'Stocks collapse and banks fail. The Great Depression begins — expect years of hardship before recovery.':`Markets crash ${Math.round(e.s*100)}%; a recession follows.`)}
  if(e.k==='war'){S.war={n:e.n,left:e.len};headline(e.n,`War breaks out. Taxes jump, heavy industry (rail, steel, mining, shipping, autos, aircraft) earns 25% more, everything else a little less, for about ${Math.round(e.len/12)} years.`)}
  if(e.k==='flu'){S.health=Math.max(5,S.health-18);S.econ.phase=-1;S.econ.left=8;headline(e.n,'A deadly pandemic sweeps the world. Your health takes a blow and the economy stalls.')}
  if(e.k==='oil'){applyMult({OIL:2.5,VLT:1.3,NOVA:.75,ATL:.85});S.shocks.oil=12;S.econ.phase=-1;S.econ.left=16;headline(e.n,'An oil embargo quadruples fuel prices. Energy soars; airlines, freight and automakers suffer, and inflation bites.')}
  if(e.k==='bubble'){S.shocks.bubble=36;headline(e.n,'Internet stocks go parabolic. It will not last forever.','good')}});
 if(S.war&&--S.war.left<=0){log(`${S.war.n} ends.`,'good');notify('Peace',`${S.war.n} is over. Taxes ease and industry returns to normal.`,'good',true);S.war=null}}

 INSTR.forEach(t=>{if(fromOf(t)===y&&S.year0<y){news.push(`${t.n} lists on the exchange`);const m=S.market[t.k];m.p=t.p*(1+gauss()*.1);m.h=[m.p]}});
 BIZ.forEach(t=>{if(FROM[t.id]===y&&S.year0<y)news.push(`new industry: ${t.n}`);if(UNTIL[t.id]===y)news.push(`${t.n}s begin to decline`)});

 ERAS.forEach(([a,n])=>{if(a===y&&S.year0<y)news.unshift(`a new era begins: ${n}`)});
 if(news.length){log(`${y}: ${news.join('; ')}.`,'info');notify(`${y} — ${eraName()}`,news.join(' · '),'info',true)}}
